spring.application.name=backend
server.port=${PORT:8080}

# Local password comes from secrets.properties (never uploaded to GitHub).
# Online, Railway gives the password as an environment variable.
spring.config.import=optional:classpath:secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/student_attendance
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true